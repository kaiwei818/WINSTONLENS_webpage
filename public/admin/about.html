<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title data-page="About page · Admin"></title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <header class="site-header admin-header">
    <a class="site-name" href="/admin/"><span data-site="name"></span> admin</a>
    <nav>
      <a href="/about" target="_blank">View About page</a>
      <button type="button" class="round-button theme-toggle" id="theme-toggle" data-theme-toggle hidden>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
      </button>
    </nav>
  </header>

  <main>
    <a class="back-link" href="/admin/">All sets</a>
    <h1>About page</h1>

    <section class="panel" aria-labelledby="portrait-heading">
      <h2 id="portrait-heading">Portrait</h2>
      <div class="portrait-editor">
        <img id="portrait-preview" alt="" hidden>
        <div>
          <p class="muted" id="portrait-status">No portrait yet.</p>
          <label class="button-like" for="portrait-input">Choose a photo</label>
          <input id="portrait-input" type="file" accept="image/jpeg,image/png,image/webp" class="visually-hidden">
          <button type="button" id="portrait-remove" class="button-secondary" hidden>Remove</button>
        </div>
      </div>
      <p class="muted small">Shrunk in your browser like set photos, without a watermark. Camera location data is removed.</p>
    </section>

    <!-- Like set details, every box saves by itself when you click outside it. -->
    <form class="panel" id="about-form" aria-labelledby="bio-heading" data-nofold>
      <h2 id="bio-heading">Bio</h2>
      <label for="bio">A few paragraphs about you and your photography. Leave an empty line between paragraphs.</label>
      <textarea id="bio" rows="8" maxlength="5000"></textarea>
      <label for="bio_zh">The bio in 繁體中文 (optional: shown to visitors reading in Chinese; empty shows the English one)</label>
      <textarea id="bio_zh" rows="8" maxlength="5000" lang="zh-Hant-TW"></textarea>

      <h2>Gear</h2>
      <label for="gear">One item per line. Start a line with a name and a colon to label it, for example "Camera: Sony A7 IV". Leave empty to hide the Gear section.</label>
      <textarea id="gear" rows="6" maxlength="2000" placeholder="Camera: Sony A7 IV&#10;Lens: Sony FE 35mm f/1.8&#10;Lens: Sony FE 85mm f/1.8&#10;Editing: Lightroom Classic"></textarea>

      <h2>Contact</h2>
      <label for="email">Email</label>
      <input id="email" type="email" maxlength="200" placeholder="you@example.com">
      <label for="phone">Phone (optional; start with + and your country code, for example +886, so it works from abroad)</label>
      <input id="phone" type="tel" maxlength="40" placeholder="+886 912 345 678" autocomplete="tel">
      <label for="instagram">Instagram name</label>
      <input id="instagram" type="text" maxlength="200" placeholder="winstonlens">
      <label for="link_label">Other link: name (optional)</label>
      <input id="link_label" type="text" maxlength="40" placeholder="LINE, YouTube, Behance...">
      <label for="link_url">Other link: address</label>
      <input id="link_url" type="url" maxlength="500" placeholder="https://...">

      <div class="actions">
        <button type="submit">Save</button>
        <span class="save-status" id="about-status" role="status"></span>
      </div>
    </form>
  </main>

  <script src="/js/admin-about.js" type="module"></script>
  <script src="/js/admin-chrome.js" type="module"></script>
</body>
</html>
